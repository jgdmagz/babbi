<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2414">
<title>Babbi's Treasure Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --wood: #3b2414;
    --parch: #f3e2b8;
    --parch-dark: #d9bd83;
    --ink: #4a2c14;
    --ink-soft: #7a5230;
    --trail: #a3311f;
    --seal: #9e1b1b;
    --gold: #d9a63a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #5a3820 0%, var(--wood) 70%);
    color: var(--ink);
    font-family: "IM Fell English", Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh; overflow-x: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  header { text-align: center; padding: 14px 16px 6px; color: var(--parch); }
  header h1 {
    font-family: "Pirata One", serif; font-weight: 400; margin: 0;
    font-size: clamp(28px, 8vw, 42px); letter-spacing: 1px;
    text-shadow: 0 2px 0 #000a;
  }
  header p { margin: 2px 0 0; font-style: italic; opacity: .85; font-size: 15px; }

  .map-wrap {
    /* Phone first: the whole map fits one screen, no scrolling needed */
    position: relative;
    width: min(100% - 16px, 460px, (100dvh - 150px) * 360 / 620);
    margin: 4px auto 12px; aspect-ratio: 360 / 620;
    filter: drop-shadow(0 10px 18px #0008);
  }
  .map-wrap svg { width: 100%; height: 100%; display: block; }

  /* Stops */
  .stop { cursor: pointer; outline: none; }
  .stop.locked { cursor: default; }
  .stop .glow { fill: var(--gold); opacity: 0; transform-box: fill-box; transform-origin: center; }
  .stop.active .glow { animation: pulse 1.6s ease-in-out infinite; }
  .stop .scroll-icon { transition: opacity .4s, transform .4s; transform-box: fill-box; transform-origin: center; }
  .stop.locked .scroll-icon { opacity: 0; transform: scale(.4); }
  .stop.active .scroll-icon { animation: bob 1.6s ease-in-out infinite; }
  .stop .lock { transition: opacity .4s; }
  .stop:not(.locked) .lock { opacity: 0; }
  .stop .done-mark { opacity: 0; transition: opacity .5s; }
  .stop.done .done-mark { opacity: 1; }
  .stop .label { font-family: "Pirata One", serif; font-size: 15px; fill: var(--ink); }
  .stop.locked .label { fill: var(--ink-soft); opacity: .55; }
  @keyframes pulse { 0%,100% { opacity: 0; transform: scale(.6);} 50% { opacity: .55; transform: scale(1.25);} }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg);} 50% { transform: translateY(-4px) rotate(6deg);} }

  .trail-reveal { transition: stroke-dashoffset 2.4s ease-in-out; }

  .hint {
    color: var(--parch); text-align: center; font-style: italic;
    margin: -6px 16px 18px; min-height: 1.4em; font-size: 16px;
  }

  /* Overlay + scroll */
  .overlay {
    position: fixed; inset: 0; background: #1a0e06cc; backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 10; opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .scroll { width: min(100%, 400px); position: relative; }
  .rod {
    height: 26px; border-radius: 13px; position: relative; z-index: 2;
    background: linear-gradient(#c79a5b, #8a5a2b 55%, #5e3a18);
    box-shadow: 0 3px 6px #0007;
  }
  .rod::before, .rod::after {
    content: ""; position: absolute; top: -4px; width: 22px; height: 34px; border-radius: 8px;
    background: linear-gradient(#6a3f1a, #3b2210);
  }
  .rod::before { left: -10px; } .rod::after { right: -10px; }

  .paper {
    margin: -8px 10px; overflow: hidden; max-height: 0;
    background:
      radial-gradient(ellipse at 20% 10%, #fff6 0, transparent 40%),
      radial-gradient(ellipse at 80% 90%, #b8904a55 0, transparent 50%),
      linear-gradient(90deg, var(--parch-dark), var(--parch) 12%, var(--parch) 88%, var(--parch-dark));
    transition: max-height 1.1s cubic-bezier(.5,.1,.3,1);
    box-shadow: inset 0 8px 10px -6px #0005, inset 0 -8px 10px -6px #0005;
  }
  .scroll.open .paper { max-height: 80dvh; overflow-y: auto; }
  .paper-inner { padding: 30px 24px 26px; text-align: center; }
  .paper .stop-no { font-family: "Pirata One", serif; color: var(--trail); font-size: 18px; letter-spacing: 1px; }
  .paper .msg { font-size: clamp(22px, 6.4vw, 28px); line-height: 1.3; margin: 8px 0 14px; }
  .paper img { width: 100%; border-radius: 6px; border: 3px solid var(--ink-soft); box-shadow: 0 4px 10px #0004; margin: 4px 0 14px; filter: sepia(.15); }
  .paper button {
    font-family: "Pirata One", serif; font-size: 20px; color: var(--parch);
    background: var(--ink); border: 0; border-radius: 999px; padding: 10px 26px; cursor: pointer;
  }
  .paper button:active { transform: translateY(1px); }

  /* Wax seal sits between the rods while closed */
  .seal {
    position: absolute; left: 50%; top: 13px; z-index: 3;
    width: 78px; height: 78px; margin-left: -39px; margin-top: -39px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d44 0, var(--seal) 45%, #5c0c0c 100%);
    box-shadow: 0 4px 10px #0008, inset 0 -4px 8px #0006;
    display: grid; place-items: center; cursor: pointer;
    font-family: "Pirata One", serif; font-size: 34px; color: #f6c9c0cc;
    transition: transform .6s cubic-bezier(.5,-.4,.7,1.4), opacity .6s;
    animation: wiggle 2s ease-in-out infinite;
  }
  .seal-tip {
    position: absolute; left: 0; right: 0; top: 64px; text-align: center; color: var(--parch);
    font-style: italic; transition: opacity .3s;
  }
  .scroll.open .seal { transform: translateY(140px) rotate(160deg) scale(.4); opacity: 0; pointer-events: none; animation: none; }
  .scroll.open .seal-tip { opacity: 0; }
  @keyframes wiggle { 0%,80%,100% { rotate: 0deg; } 85% { rotate: -8deg; } 90% { rotate: 8deg; } 95% { rotate: -4deg; } }

  /* Intro */
  .intro-card { text-align: center; color: var(--parch); max-width: 360px; }
  .intro-card h2 { font-family: "Pirata One", serif; font-weight: 400; font-size: 44px; margin: 0 0 6px; line-height: 1.05; }
  .intro-card p { font-size: 18px; font-style: italic; margin: 0 0 22px; }
  .intro-card button {
    font-family: "Pirata One", serif; font-size: 22px; color: var(--ink);
    background: var(--gold); border: 0; border-radius: 999px; padding: 12px 30px; cursor: pointer;
    box-shadow: 0 4px 0 #8a6420;
  }

  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 20; pointer-events: none;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110dvh) rotate(720deg); } }

  .reset { background: none; border: 0; color: var(--parch); opacity: .45; font-family: inherit; font-size: 13px;
    text-decoration: underline; margin-bottom: 18px; cursor: pointer; display: none; }
  .reset.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Babbi's Treasure Map</h1>
  <p>A birthday quest, one scroll at a time</p>
</header>

<div class="map-wrap">
  <svg viewBox="0 0 360 620" xmlns="http://www.w3.org/2000/svg" aria-label="Treasure map">
    <defs>
      <filter id="rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="9"/>
      </filter>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0.12  0 0 0 0.18 0"/>
        <feComposite in2="SourceGraphic" operator="in"/>
      </filter>
      <radialGradient id="paperGrad" cx="50%" cy="45%" r="70%">
        <stop offset="0" stop-color="#f7e8c2"/>
        <stop offset=".7" stop-color="#ead29c"/>
        <stop offset="1" stop-color="#c49a55"/>
      </radialGradient>
      <!-- masks that reveal each dashed trail segment -->
      <mask id="m1" maskUnits="userSpaceOnUse"><path class="trail-reveal" id="r1" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" fill="none" stroke="#fff" stroke-width="14" d="M90 540 C 150 520, 170 470, 220 470 S 290 440, 270 400"/></mask>
      <mask id="m2" maskUnits="userSpaceOnUse"><path class="trail-reveal" id="r2" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" fill="none" stroke="#fff" stroke-width="14" d="M270 400 C 250 350, 150 370, 110 330 S 70 260, 110 240"/></mask>
      <mask id="m3" maskUnits="userSpaceOnUse"><path class="trail-reveal" id="r3" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" fill="none" stroke="#fff" stroke-width="14" d="M110 240 C 160 220, 200 250, 240 210 S 300 150, 270 110"/></mask>
    </defs>

    <!-- Parchment -->
    <path filter="url(#rough)" fill="url(#paperGrad)" stroke="#8a5e2c" stroke-width="3"
      d="M14 18 L346 12 L350 604 L10 608 Z"/>
    <rect x="0" y="0" width="360" height="620" filter="url(#grain)" fill="#000" opacity=".9" style="mix-blend-mode:multiply" clip-path="inset(14px round 6px)"/>

    <!-- Sea at the top-left -->
    <g stroke="#6f8a8a" stroke-width="1.6" fill="none" opacity=".7" stroke-linecap="round">
      <path d="M30 70 q8 -6 16 0 t16 0"/><path d="M50 95 q8 -6 16 0 t16 0"/>
      <path d="M26 120 q8 -6 16 0 t16 0"/><path d="M70 60 q8 -6 16 0 t16 0"/>
    </g>
    <!-- Mountains -->
    <g fill="none" stroke="#7a5230" stroke-width="2" stroke-linejoin="round" opacity=".75">
      <path d="M170 150 l18 -30 l18 30"/><path d="M196 150 l14 -22 l14 22"/>
      <path d="M40 420 l16 -26 l16 26"/><path d="M62 420 l12 -18 l12 18"/>
    </g>
    <!-- Trees -->
    <g fill="#6b7a3e" opacity=".8">
      <path d="M300 500 l8 -18 l8 18z"/><path d="M314 510 l8 -18 l8 18z"/><path d="M290 518 l8 -18 l8 18z"/>
      <path d="M30 300 l7 -16 l7 16z"/><path d="M44 310 l7 -16 l7 16z"/>
      <path d="M200 560 l7 -16 l7 16z"/><path d="M214 568 l7 -16 l7 16z"/>
    </g>
    <!-- Compass -->
    <g transform="translate(300 72)" opacity=".85">
      <circle r="24" fill="none" stroke="#7a5230" stroke-width="1.5"/>
      <path d="M0 -30 L6 0 L0 30 L-6 0Z" fill="#7a5230"/>
      <path d="M-30 0 L0 5 L30 0 L0 -5Z" fill="#b58a55"/>
      <text y="-34" text-anchor="middle" font-family="Pirata One" font-size="14" fill="#4a2c14">N</text>
    </g>

    <!-- Faint "ghost" route so she can see there's more to come -->
    <path d="M90 540 C 150 520, 170 470, 220 470 S 290 440, 270 400 C 250 350, 150 370, 110 330 S 70 260, 110 240 C 160 220, 200 250, 240 210 S 300 150, 270 110"
      fill="none" stroke="#7a5230" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round" opacity=".25"/>

    <!-- Revealed trail segments -->
    <g fill="none" stroke="var(--trail)" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round">
      <path mask="url(#m1)" d="M90 540 C 150 520, 170 470, 220 470 S 290 440, 270 400"/>
      <path mask="url(#m2)" d="M270 400 C 250 350, 150 370, 110 330 S 70 260, 110 240"/>
      <path mask="url(#m3)" d="M110 240 C 160 220, 200 250, 240 210 S 300 150, 270 110"/>
    </g>

    <!-- Stops (filled in by script) -->
    <g id="stops"></g>
  </svg>
</div>

<p class="hint" id="hint"></p>
<button class="reset" id="reset">start the hunt over</button>

<!-- Intro -->
<div class="overlay" id="intro">
  <div class="intro-card">
    <h2>Happy Birthday, Babbi!</h2>
    <p>Ahoy, birthday girl. A treasure hunt awaits. Follow the trail, break each seal, and see where the day takes you.</p>
    <button id="begin">Begin the quest</button>
  </div>
</div>

<!-- Scroll -->
<div class="overlay" id="overlay">
  <div class="scroll" id="scroll">
    <div class="rod"></div>
    <div class="seal" id="seal" role="button" aria-label="Break the seal">B</div>
    <div class="seal-tip" id="sealTip">tap the seal to unlatch</div>
    <div class="paper"><div class="paper-inner" id="paper"></div></div>
    <div class="rod"></div>
  </div>
</div>

<script>
const STOPS = [
  { x: 90,  y: 540, name: "Stop I",   msg: "Look where you always make your matcha" },
  { x: 270, y: 400, name: "Stop II",  msg: "Leave by 9am. It's going to be a two hour drive.", img: "park.JPG" },
  { x: 110, y: 240, name: "Stop III", msg: "Cathedral of the Blessed Sacrament" },
  { x: 270, y: 110, name: "Final Stop", msg: "Dinner time", final: true },
];
const KEY = "babbi-hunt-progress";
const NS = "http://www.w3.org/2000/svg";

let progress = 0; // number of scrolls opened
try { progress = Math.min(STOPS.length, parseInt(localStorage.getItem(KEY)) || 0); } catch {}
const save = () => { try { localStorage.setItem(KEY, progress); } catch {} };

const stopsG = document.getElementById("stops");
const hint = document.getElementById("hint");
const overlay = document.getElementById("overlay");
const scroll = document.getElementById("scroll");
const paper = document.getElementById("paper");
const reset = document.getElementById("reset");
let current = -1;

function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

// Build each stop: glow, locked padlock, rolled scroll, checkmark X, label
STOPS.forEach((s, i) => {
  const g = el("g", { class: "stop locked", transform: `translate(${s.x} ${s.y})`, tabindex: 0, role: "button" }, stopsG);
  el("circle", { r: 34, fill: "transparent" }, g); // bigger tap target for fingers
  el("circle", { class: "glow", r: 26 }, g);
  el("circle", { r: 20, fill: "#f3e2b8", stroke: "#7a5230", "stroke-width": 2, "stroke-dasharray": "3 3" }, g);

  const lock = el("g", { class: "lock", fill: "#7a5230", opacity: .7 }, g);
  el("rect", { x: -7, y: -3, width: 14, height: 11, rx: 2 }, lock);
  el("path", { d: "M-4.5 -3 v-4 a4.5 4.5 0 0 1 9 0 v4", fill: "none", stroke: "#7a5230", "stroke-width": 2.2 }, lock);

  const sc = el("g", { class: "scroll-icon" }, g);
  el("rect", { x: -12, y: -8, width: 24, height: 16, rx: 2, fill: "#f7e8c2", stroke: "#8a5a2b", "stroke-width": 1.5 }, sc);
  el("rect", { x: -15, y: -10, width: 5, height: 20, rx: 2.5, fill: "#8a5a2b" }, sc);
  el("rect", { x: 10, y: -10, width: 5, height: 20, rx: 2.5, fill: "#8a5a2b" }, sc);
  el("circle", { r: 4.5, fill: "#9e1b1b" }, sc);

  const done = el("g", { class: "done-mark", stroke: "#a3311f", "stroke-width": 4, "stroke-linecap": "round" }, g);
  el("path", { d: "M-9 -9 L9 9 M9 -9 L-9 9" }, done);

  const label = el("text", { class: "label", "text-anchor": "middle", y: s.y > 500 ? -30 : 38 }, g);
  label.textContent = s.name;

  const go = () => { if (!g.classList.contains("locked")) openScroll(i); };
  g.addEventListener("click", go);
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
});
const stopEls = [...stopsG.children];

function render(animateTrail) {
  stopEls.forEach((g, i) => {
    g.classList.toggle("locked", i > progress);
    g.classList.toggle("active", i === progress);
    g.classList.toggle("done", i < progress);
  });
  // Trail i connects stop i -> i+1, drawn once stop i has been opened
  for (let i = 1; i <= 3; i++) {
    const r = document.getElementById("r" + i);
    if (!animateTrail) r.style.transition = "none";
    r.style.strokeDashoffset = progress >= i ? 0 : 1;
    if (!animateTrail) { r.getBoundingClientRect(); r.style.transition = ""; }
  }
  if (progress >= STOPS.length) {
    hint.textContent = "Quest complete. Happy birthday, Babbi ♥";
    reset.classList.add("show");
  } else {
    hint.textContent = progress === 0 ? "Tap the glowing scroll to begin" : "Follow the trail to the next scroll…";
    reset.classList.remove("show");
  }
}

function openScroll(i) {
  current = i;
  const s = STOPS[i];
  paper.innerHTML = `
    <div class="stop-no">~ ${s.name} ~</div>
    <div class="msg">${s.msg}</div>
    ${s.img ? `<img src="${s.img}" alt="The park">` : ""}
    ${s.final ? `<div class="msg" style="font-family:'Pirata One';color:var(--trail)">Happy Birthday, Babbi!</div>` : ""}
    <button id="closeBtn">${s.final ? "The end ♥" : "Onward!"}</button>`;
  document.getElementById("closeBtn").onclick = closeScroll;
  scroll.classList.remove("open");
  scroll.scrollTop = 0;
  // A scroll she already opened doesn't need re-unsealing
  if (i < progress) scroll.classList.add("open");
  overlay.classList.add("show");
}

document.getElementById("seal").addEventListener("click", () => {
  scroll.classList.add("open");
  if (current === progress) {
    progress++;
    save();
    if (STOPS[current].final) setTimeout(confetti, 700);
  }
});

function closeScroll() {
  overlay.classList.remove("show");
  // Let the overlay fade, then draw the trail to the next stop
  setTimeout(() => render(true), 350);
}

function confetti() {
  const colors = ["#d9a63a", "#9e1b1b", "#f3e2b8", "#6b7a3e", "#e7869a"];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
    c.style.animationDelay = Math.random() * .8 + "s";
    c.style.borderRadius = Math.random() > .5 ? "50%" : "2px";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}

reset.addEventListener("click", () => {
  if (!confirm("Start the treasure hunt over?")) return;
  progress = 0; save(); render(false);
});

// Intro only on first visit
const intro = document.getElementById("intro");
if (progress === 0) intro.classList.add("show");
document.getElementById("begin").onclick = () => intro.classList.remove("show");

render(false);
</script>
</body>
</html>
